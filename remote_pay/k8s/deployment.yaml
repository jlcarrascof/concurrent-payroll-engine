apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-pay-api
  labels:
    app: remote-pay-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remote-pay-api
  template:
    metadata:
      labels:
        app: remote-pay-api
    spec:
      containers:
        - name: remote-pay-api
          image: tu-usuario/remote-pay:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: remote-pay-config
            - secretRef:
                name: remote-pay-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
