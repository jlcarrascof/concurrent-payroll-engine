name: CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: remote_pay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          elixir-version: "1.16.3"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            remote_pay/deps
            remote_pay/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('remote_pay/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get
        working-directory: ./remote_pay

      - name: Check formatting
        run: mix format --check-formatted
        working-directory: ./remote_pay

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
        working-directory: ./remote_pay

      - name: Create database
        run: mix ecto.create
        working-directory: ./remote_pay
        env:
          MIX_ENV: test

      - name: Run migrations
        run: mix ecto.migrate
        working-directory: ./remote_pay
        env:
          MIX_ENV: test

      - name: Run tests
        run: mix test
        working-directory: ./remote_pay
        env:
          MIX_ENV: test
